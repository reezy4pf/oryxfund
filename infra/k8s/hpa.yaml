apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oryx-core-api-hpa
  namespace: oryx-fund-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oryx-core-api
  minReplicas: 4
  maxReplicas: 30
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
